name: Create New Release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional revision number for rebuilding the same app version (creates vX.Y.Z-rN)
        type: string
        default: ''
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'
      
      - name: Use Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Compile RyukSign
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          make
          mkdir upload
          mv packages/* upload/

      - name: Get Version
        id: get_version
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/*.app/Info.plist)
          if [ -n "$REVISION" ]; then
            case "$REVISION" in
              *[!0-9]*) echo "revision must be a number" >&2; exit 1 ;;
            esac
            VERSION="${VERSION}-r${REVISION}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: RyukSign v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            upload/*ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
